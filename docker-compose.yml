# Backend + frontend stack (PROJECT_SPEC.md section 10). The .NET validation
# service is added in Phase 5b.
#
#   docker compose up --build
#   → frontend at http://localhost:3000, backend at http://localhost:8000
services:
  validation-service:
    build:
      context: ./validation-service
    image: f1-strategy-validation
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: f1-strategy-backend
    ports:
      - "8000:8000"
    environment:
      # CORS allow-list for the browser origin (finalized here per spec 7/8).
      CORS_ORIGINS: "http://localhost:3000"
      # Enable the .NET legality check before simulating (spec section 9).
      VALIDATION_ENABLED: "true"
      VALIDATION_SERVICE_URL: "http://validation-service:8080"
    depends_on:
      validation-service:
        condition: service_healthy
    volumes:
      # Persist processed race data + FastF1 cache across rebuilds so we never
      # re-fetch from FastF1. Paths match the code's BACKEND_ROOT resolution:
      #   PROCESSED_DIR = /app/data/processed ; CACHE_DIR = /app/app/data/cache
      - ./backend/data/processed:/app/data/processed
      - ./backend/app/data/cache:/app/app/data/cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-reachable backend URL, inlined at build time (see frontend/Dockerfile).
        # This is the host-published port, NOT the compose service name.
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    image: f1-strategy-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
