# Validation-service Deployment + Service (ClusterIP).
# Service name `validation-service` matches VALIDATION_SERVICE_URL in the ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-service
  labels:
    app: validation-service
    app.kubernetes.io/part-of: f1-strategy-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation-service
  template:
    metadata:
      labels:
        app: validation-service
    spec:
      containers:
        - name: validation-service
          image: f1-strategy-validation:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: validation-service
  labels:
    app: validation-service
spec:
  type: ClusterIP
  selector:
    app: validation-service
  ports:
    - name: http
      port: 8080
      targetPort: http
